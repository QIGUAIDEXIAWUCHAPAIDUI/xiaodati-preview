<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小大题系列笔记预览站</title>
  <meta name="description" content="笔记展示开头、正中、最后部分页码。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%239d2c2c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/site.css?v=4">
</head>
<body>
  <div id="app"></div>
  <p class="visit-count">历史访问量 <span id="visit-shown">167</span></p>
  <script>
    (function () {
      var shown = document.getElementById("visit-shown");
      var name = "BusuanziCb_" + Math.floor(Math.random() * 1e12);
      window[name] = function (data) {
        var n = data && parseInt(data.site_pv, 10);
        if (isFinite(n)) shown.textContent = String(n);
      };
      var s = document.createElement("script");
      s.referrerPolicy = "no-referrer-when-downgrade";
      s.src = "https://busuanzi.ibruce.info/busuanzi?jsonpCallback=" + name;
      document.head.appendChild(s);
    })();
  </script>
  <script src="catalog.js"></script>
  <script src="assets/site.js?v=4"></script>
</body>
</html>
